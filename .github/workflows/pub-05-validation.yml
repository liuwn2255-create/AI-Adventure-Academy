name: PUB-05 game publication read validation
on:
  push:
    branches:
      - pub-05-game-publication-read
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/game-publication-reader.mjs
      - run: node --check test/game-publication-reader.test.mjs
      - run: node --test test/game-publication-reader.test.mjs test/teacher-review.test.mjs test/pub-03-integration.test.mjs test/cloudflare-publication.test.mjs test/publication-service.test.mjs test/unit-registry.test.mjs
