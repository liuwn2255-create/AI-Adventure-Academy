name: SEC-03 teacher auth and D1 review persistence
on:
  push:
    branches: [sec-03-teacher-auth-persistence]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/cloudflare-reviewer-auth.mjs
      - run: node --check scripts/d1-reviewed-question-store.mjs
      - run: node --test test/sec-03-reviewer-persistence.test.mjs test/sec-02-approval-bridge.test.mjs test/sec-01-hardening.test.mjs test/pub-03-integration.test.mjs test/game-publication-reader.test.mjs test/cloudflare-publication.test.mjs test/teacher-review.test.mjs test/publication-service.test.mjs test/unit-registry.test.mjs
      - run: python3 test/sec-02-sqlite-migration.py
      - run: python3 test/sec-03-sqlite-migration.py
