name: SEC-09 review HTTP integration
on:
  push:
    branches: [sec-09-review-http-integration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: node --check scripts/cloudflare-review-worker.mjs
      - name: SEC-09 and security regression
        run: node --test test/sec-09-review-http.test.mjs test/sec-07-security-chain.test.mjs test/sec-06-candidate-ingress.test.mjs test/sec-05-audited-chain.test.mjs test/sec-04-review-decisions.test.mjs test/sec-03-reviewer-persistence.test.mjs test/sec-02-approval-bridge.test.mjs test/sec-01-hardening.test.mjs test/cloudflare-publication.test.mjs
