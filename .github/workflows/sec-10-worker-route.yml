name: SEC-10 integrated Worker routes
on:
  push:
    branches: [sec-10-worker-route-integration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check scripts/cloudflare-integrated-worker.mjs
          node --check test/sec-10-worker-route.test.mjs
      - name: SEC-10 through SEC-01 targeted regression
        run: node --test test/sec-10-worker-route.test.mjs test/sec-09-review-http.test.mjs test/sec-07-security-chain.test.mjs test/sec-06-candidate-ingress.test.mjs test/sec-05-audited-chain.test.mjs test/sec-04-review-decisions.test.mjs test/sec-03-reviewer-persistence.test.mjs test/sec-02-approval-bridge.test.mjs test/sec-01-hardening.test.mjs test/cloudflare-publication.test.mjs
