<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="theme-color" content="#bcecff" />
    <title>探險家 3D 角色獨立驗證</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px;font-family:system-ui,"Noto Sans TC",sans-serif;color:#21485a;background:linear-gradient(#9bdfff,#effbff)}main{width:min(900px,100%);margin:auto}.card{padding:18px;border:3px solid white;border-radius:24px;background:#ffffffd9;box-shadow:0 7px 0 #a8d5df}.preview{height:min(58vh,520px);min-height:330px;margin:14px 0;overflow:hidden;border:2px solid #b8d8dd;border-radius:20px;background:radial-gradient(ellipse at 50% 82%,#c0ecd5,#e7faff 55%,#c8edff);position:relative}.preview canvas{display:block;width:100%;height:100%}.controls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0}.controls button,.motion button{min-height:50px;padding:10px;border:2px solid #9dcbd4;border-radius:13px;background:white;color:#244e61;font:inherit;font-weight:800;cursor:pointer;touch-action:manipulation}.motion{display:flex;flex-wrap:wrap;gap:8px}.motion button{flex:1}.status{min-height:28px;padding:8px 10px;border-radius:12px;background:#f5f6d8;font-weight:750}.status.error{background:#ffe9e5;color:#953e35}.hint{line-height:1.55;color:#526d7a}.fallback{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:#a13d34}.fallback[hidden]{display:none}@media(max-width:500px){body{padding:12px}.card{padding:13px}.preview{min-height:300px;height:48vh}.controls{grid-template-columns:repeat(2,minmax(0,1fr))}.motion{display:grid;grid-template-columns:1fr}.controls button,.motion button{min-height:54px}}
      @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
    </style>
    <script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
    <script>
      window.addEventListener('error', (event) => {
        const status = document.getElementById('status');
        if (!status) return;
        status.classList.add('error');
        status.textContent = `模組或場景錯誤：${event.message || '無法載入預覽模組'}`;
      });
      window.addEventListener('unhandledrejection', (event) => {
        const status = document.getElementById('status');
        if (!status) return;
        status.classList.add('error');
        status.textContent = `預覽載入錯誤：${event.reason?.message || String(event.reason)}`;
      });
    </script>
  </head>
  <body>
    <main>
      <section class="card">
        <p>隔離測試場景・不寫入遊戲進度</p>
        <h1>探險家 3D 角色動畫驗證</h1>
        <p class="hint">以下預覽只用來檢查指定 GLB 的骨架與動畫。模型沒有 Idle 動畫；按「停止」時會回到靜止姿勢。</p>
        <div id="preview" class="preview" aria-label="3D 角色預覽"><div id="fallback" class="fallback">正在載入角色模型…</div></div>
        <p id="status" class="status" role="status" aria-live="polite">準備載入模型。</p>
        <div class="controls" aria-label="角色轉向">
          <button type="button" data-direction="up">面向前方</button>
          <button type="button" data-direction="left">轉向左側</button>
          <button type="button" data-direction="down">面向後方</button>
          <button type="button" data-direction="right">轉向右側</button>
        </div>
        <div class="motion" aria-label="角色動作">
          <button type="button" data-motion="walk">播放走路</button>
          <button type="button" data-motion="run">播放跑步</button>
          <button type="button" data-motion="stop">停止</button>
        </div>
      </section>
    </main>
    <script type="module">
      import('./character-preview.js').catch((error) => {
        const status = document.getElementById('status');
        status.classList.add('error');
        status.textContent = `角色模組載入失敗：${error?.message || String(error)}`;
      });
    </script>
  </body>
</html>
